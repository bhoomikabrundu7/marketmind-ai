version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marketmind-postgres
    restart: always
    environment:
      POSTGRES_USER: marketmind
      POSTGRES_PASSWORD: marketmind_secure_password
      POSTGRES_DB: marketmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: marketmind-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://marketmind:marketmind_secure_password@db:5432/marketmind_db
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketmind-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data: